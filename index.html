<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หารค่าอาหาร 🍜</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --surface2: #1e1e2e;
    --border: rgba(255,255,255,0.07);
    --accent: #ff6b6b;
    --accent2: #ffa94d;
    --accent3: #69db7c;
    --text: #e8e8f0;
    --muted: #6e6e8a;
    --gold: #ffd43b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Kanit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255,107,107,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(105,219,124,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 50% 50%, rgba(255,169,77,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease both;
  }
  .header-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 8px;
    animation: bounce 2s ease infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .header h1 {
    font-size: 2.4rem;
    font-weight: 700;
    background: linear-gradient(135deg, #ff6b6b, #ffa94d, #ffd43b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }
  .header p {
    color: var(--muted);
    font-weight: 300;
    font-size: 0.95rem;
    margin-top: 6px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    opacity: 0.6;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 0.75rem;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Section colors */
  .card.section-1::before { background: linear-gradient(90deg, transparent, #ff6b6b, transparent); }
  .card.section-2::before { background: linear-gradient(90deg, transparent, #ffa94d, transparent); }
  .card.section-3::before { background: linear-gradient(90deg, transparent, #69db7c, transparent); }
  .card.section-4::before { background: linear-gradient(90deg, transparent, #74c0fc, transparent); }

  /* Form inputs */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  label {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 400;
  }
  input[type="text"], input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Kanit', sans-serif;
    font-size: 0.95rem;
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,107,0.12);
  }
  input::placeholder { color: var(--muted); opacity: 0.5; }

  /* Person row */
  .person-row {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 8px;
    animation: slideIn 0.3s ease both;
    transition: border-color 0.2s;
    position: relative;
  }
  .person-row:hover { border-color: rgba(255,255,255,0.15); }
  .person-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .person-avatar:hover { transform: scale(1.12); box-shadow: 0 0 0 3px rgba(255,255,255,0.1); }
  .person-row input[type="text"] {
    background: transparent;
    border: none;
    padding: 6px 8px;
    font-size: 0.9rem;
    flex: 1;
    box-shadow: none;
  }
  .person-row input:focus { border: none; box-shadow: none; }

  /* Avatar picker popup */
  .avatar-picker {
    position: absolute;
    left: 0; top: calc(100% + 8px);
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 16px;
    z-index: 100;
    width: 300px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85) translateY(-8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .avatar-picker-title {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-bottom: 14px;
  }
  .emoji-option {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    border: 1.5px solid transparent;
  }
  .emoji-option:hover { background: var(--surface2); transform: scale(1.2); }
  .emoji-option.selected { border-color: var(--accent); background: rgba(255,107,107,0.15); }
  .color-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-option {
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-option:hover { transform: scale(1.2); }
  .color-option.selected { border-color: white; transform: scale(1.15); }
  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 6px;
    border-radius: 8px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
  }
  .delete-btn:hover { color: #ff6b6b; background: rgba(255,107,107,0.1); }

  /* Menu item */
  .menu-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    animation: slideIn 0.3s ease both;
    transition: border-color 0.2s;
  }
  .menu-item:hover { border-color: rgba(255,255,255,0.15); }
  .menu-item-header {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .menu-item-header input[type="text"] { flex: 2; }
  .menu-item-header input[type="number"] { flex: 1; min-width: 90px; }
  .menu-item-header .delete-btn { align-self: center; }

  .person-checkboxes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .person-check {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.82rem;
    user-select: none;
  }
  .person-check.checked {
    background: rgba(255,107,107,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .person-check input { display: none; }
  .check-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s;
  }
  .person-check.checked .check-dot { background: var(--accent); }

  /* Buttons */
  .btn {
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-family: 'Kanit', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-outline {
    background: transparent;
    border: 1.5px dashed var(--border);
    color: var(--muted);
    width: 100%;
    justify-content: center;
    margin-top: 6px;
  }
  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,107,107,0.05);
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b6b, #ff8c42);
    color: white;
    width: 100%;
    justify-content: center;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(255,107,107,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255,107,107,0.4);
  }
  .btn-primary:active { transform: translateY(0); }

  /* Options row */
  .options-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .toggle-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .toggle-label {
    font-size: 0.88rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toggle-label span { color: var(--muted); font-size: 0.8rem; }

  /* Toggle switch */
  .toggle {
    position: relative;
    width: 42px; height: 24px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: var(--muted);
    border-radius: 50%;
    transition: all 0.3s;
  }
  .toggle input:checked + .toggle-slider {
    background: rgba(105,219,124,0.2);
    border-color: var(--accent3);
  }
  .toggle input:checked + .toggle-slider::before {
    transform: translateX(18px);
    background: var(--accent3);
  }

  /* Results */
  #results {
    display: none;
    animation: fadeUp 0.5s ease both;
  }
  .result-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.3s ease both;
  }
  .result-item:nth-child(1) { animation-delay: 0.05s; }
  .result-item:nth-child(2) { animation-delay: 0.1s; }
  .result-item:nth-child(3) { animation-delay: 0.15s; }
  .result-item:nth-child(4) { animation-delay: 0.2s; }
  .result-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .result-name {
    font-weight: 500;
    font-size: 1rem;
  }
  .result-detail {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'Sarabun', sans-serif;
  }
  .result-amount {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
  }
  .result-amount .unit {
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--muted);
    margin-left: 2px;
  }

  .total-bar {
    background: linear-gradient(135deg, rgba(255,107,107,0.15), rgba(255,169,77,0.15));
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .total-bar-label { font-size: 0.85rem; color: var(--muted); }
  .total-bar-amount { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

  .breakdown-toggle {
    text-align: center;
    padding: 8px;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: color 0.2s;
  }
  .breakdown-toggle:hover { color: var(--text); }
  .breakdown-list { display: none; }
  .breakdown-list.open { display: block; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    font-size: 0.83rem;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-family: 'Sarabun', sans-serif;
  }
  .breakdown-row:last-child { border-bottom: none; }

  .summary-share {
    text-align: center;
    margin-top: 10px;
  }
  .btn-copy {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 24px;
    font-family: 'Kanit', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-copy:hover {
    border-color: var(--accent3);
    color: var(--accent3);
    background: rgba(105,219,124,0.08);
  }
  .copied-msg {
    display: none;
    color: var(--accent3);
    font-size: 0.85rem;
    margin-top: 8px;
  }
  .copied-msg.show { display: block; }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.3s; }
  .card:nth-child(4) { animation-delay: 0.4s; }

  /* Divider */
  .section-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .section-divider::before, .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Number input style */
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.3; }
  input[type="number"] { -moz-appearance: textfield; }

  /* Tip presets */
  .preset-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .preset-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Kanit', sans-serif;
    transition: all 0.2s;
  }
  .preset-btn:hover, .preset-btn.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255,169,77,0.1);
  }

  @media (max-width: 480px) {
    .options-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <span class="header-icon">🍜</span>
    <h1>หารค่าอาหาร</h1>
    <p>คำนวณค่าใช้จ่ายให้เป็นธรรม ไม่มีใครเสียเปรียบ</p>
  </div>

  <!-- Section 1: People -->
  <div class="card section-1">
    <div class="card-title">👥 รายชื่อเพื่อน</div>
    <div id="people-list"></div>
    <button class="btn btn-outline" onclick="addPerson()">+ เพิ่มคน</button>
  </div>

  <!-- Section 2: Menu items -->
  <div class="card section-2">
    <div class="card-title">🍽️ เมนูอาหาร</div>
    <div id="menu-list"></div>
    <button class="btn btn-outline" onclick="addMenuItem()">+ เพิ่มเมนู</button>
  </div>

  <!-- Section 3: Extra options -->
  <div class="card section-3">
    <div class="card-title">⚙️ ตัวเลือกเพิ่มเติม</div>

    <div class="toggle-group">
      <div class="toggle-row">
        <div class="toggle-label">ภาษีมูลค่าเพิ่ม (VAT 7%) <span>เพิ่มอัตโนมัติ</span></div>
        <label class="toggle">
          <input type="checkbox" id="vat-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">ค่าบริการ (Service Charge 10%)</div>
        <label class="toggle">
          <input type="checkbox" id="service-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div style="margin-top: 16px;">
      <div class="input-group" style="margin-bottom: 8px;">
        <label>ทิปพิเศษ (บาท) — แบ่งเท่ากันทุกคน</label>
        <input type="number" id="tip-amount" placeholder="0" min="0" oninput="syncTipPresets()">
      </div>
      <div class="preset-btns">
        <button class="preset-btn" onclick="setTip(0)">ไม่มี</button>
        <button class="preset-btn" onclick="setTip(20)">฿20</button>
        <button class="preset-btn" onclick="setTip(50)">฿50</button>
        <button class="preset-btn" onclick="setTip(100)">฿100</button>
        <button class="preset-btn" onclick="setTip(200)">฿200</button>
      </div>
    </div>

    <div style="margin-top: 16px;">
      <div class="input-group" style="margin-bottom: 0;">
        <label>ส่วนลด (บาท) — หักออกจากยอดรวม</label>
        <input type="number" id="discount-amount" placeholder="0" min="0">
      </div>
    </div>
  </div>

  <!-- Calculate -->
  <button class="btn btn-primary" onclick="calculate()" style="margin-bottom: 24px;">
    ✨ คำนวณเลย!
  </button>

  <!-- Results -->
  <div id="results">
    <div class="card section-4">
      <div class="card-title">💰 สรุปยอดที่ต้องจ่าย</div>

      <div class="total-bar">
        <div>
          <div style="font-weight:600; font-size:1rem;">ยอดรวมทั้งหมด</div>
          <div class="total-bar-label" id="total-detail"></div>
        </div>
        <div class="total-bar-amount" id="grand-total">฿0</div>
      </div>

      <div id="result-list"></div>

      <div class="summary-share" style="margin-top: 12px;">
        <button class="btn-copy" onclick="copyResult()">📋 คัดลอกผลลัพธ์</button>
        <div class="copied-msg" id="copied-msg">✓ คัดลอกแล้ว!</div>
      </div>
    </div>
  </div>

</div>

<script>
const COLORS = ['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#74c0fc','#da77f2','#f783ac','#63e6be','#a9e34b','#66d9e8'];
const EMOJIS = ['😊','🎉','🌟','🦊','🐱','🎸','🌈','🔥','✨','🍀','🐶','🐻','🦁','🐸','🐼','🦋','🌸','⚡','🎵','🏆','🍕','🍣','🧋','🎮','💎','🚀','🌙','🦄','🐉','🎯','💪','🤩','😎','🥳','🤖','👑','🌊','🍦','🌺','🎨'];

let people = [];
let menuItems = [];
let personId = 0;
let menuId = 0;
let activePickerId = null;

function addPerson(name = '') {
  const id = personId++;
  const color = COLORS[people.length % COLORS.length];
  const emoji = EMOJIS[people.length % EMOJIS.length];
  people.push({ id, color, emoji, name });
  renderPeople();
  renderMenuCheckboxes();
}

function removePerson(id) {
  people = people.filter(p => p.id !== id);
  if (activePickerId === id) activePickerId = null;
  renderPeople();
  renderMenuCheckboxes();
}

function openAvatarPicker(personId) {
  if (activePickerId === personId) {
    activePickerId = null;
    renderPeople();
    return;
  }
  activePickerId = personId;
  renderPeople();
  setTimeout(() => {
    document.getElementById(`picker-${personId}`)?.scrollIntoView({ block: 'nearest' });
  }, 50);
}

function selectEmoji(personId, emoji) {
  const p = people.find(x => x.id === personId);
  if (p) { p.emoji = emoji; renderPeople(); renderMenuCheckboxes(); activePickerId = personId; renderPeople(); }
}

function selectColor(personId, color) {
  const p = people.find(x => x.id === personId);
  if (p) { p.color = color; renderPeople(); renderMenuCheckboxes(); activePickerId = personId; renderPeople(); }
}

// Close picker on outside click
document.addEventListener('click', e => {
  if (activePickerId !== null && !e.target.closest('.person-row')) {
    activePickerId = null;
    renderPeople();
  }
});

function renderPeople() {
  const list = document.getElementById('people-list');
  list.innerHTML = '';
  people.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'person-row';
    const isOpen = activePickerId === p.id;

    const pickerHtml = isOpen ? `
      <div class="avatar-picker" id="picker-${p.id}" onclick="event.stopPropagation()">
        <div class="avatar-picker-title">เลือก Emoji</div>
        <div class="emoji-grid">
          ${EMOJIS.map(em => `<div class="emoji-option${em===p.emoji?' selected':''}" onclick="selectEmoji(${p.id},'${em}')">${em}</div>`).join('')}
        </div>
        <div class="avatar-picker-title">เลือกสี</div>
        <div class="color-grid">
          ${COLORS.map(c => `<div class="color-option${c===p.color?' selected':''}" style="background:${c}" onclick="selectColor(${p.id},'${c}')"></div>`).join('')}
        </div>
      </div>
    ` : '';

    row.innerHTML = `
      <div class="person-avatar" style="background:${p.color}22; color:${p.color}; border:1.5px solid ${isOpen?p.color+'cc':p.color+'44'}; ${isOpen?'transform:scale(1.1);box-shadow:0 0 0 3px '+p.color+'33;':''}" onclick="openAvatarPicker(${p.id}); event.stopPropagation();" title="กดเพื่อเปลี่ยน">${p.emoji}</div>
      <input type="text" placeholder="ชื่อเพื่อน..." value="${p.name}" oninput="updatePersonName(${p.id}, this.value)" style="color:${p.color}">
      <button class="delete-btn" onclick="removePerson(${p.id})">✕</button>
      ${pickerHtml}
    `;
    list.appendChild(row);
  });
}

function updatePersonName(id, name) {
  const p = people.find(x => x.id === id);
  if (p) {
    p.name = name;
    renderMenuCheckboxes();
  }
}

function addMenuItem() {
  const id = menuId++;
  menuItems.push({ id, name: '', price: 0, forAll: true, people: [] });
  renderMenuItems();
}

function removeMenuItem(id) {
  menuItems = menuItems.filter(m => m.id !== id);
  renderMenuItems();
}

function renderMenuItems() {
  const list = document.getElementById('menu-list');
  list.innerHTML = '';
  menuItems.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'menu-item';
    div.innerHTML = `
      <div class="menu-item-header">
        <input type="text" placeholder="ชื่อเมนู..." value="${item.name}" oninput="updateMenuName(${item.id}, this.value)">
        <input type="number" placeholder="ราคา" value="${item.price || ''}" min="0" oninput="updateMenuPrice(${item.id}, this.value)">
        <button class="delete-btn" onclick="removeMenuItem(${item.id})">✕</button>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <span style="font-size:0.78rem; color:var(--muted);">🙋 ใครกินเมนูนี้? <span id="menu-count-${item.id}" style="color:var(--accent2);"></span></span>
        <div style="display:flex;gap:6px;">
          <button onclick="selectAllForItem(${item.id})" style="font-size:0.72rem;background:rgba(116,192,252,0.12);border:1px solid rgba(116,192,252,0.3);color:#74c0fc;border-radius:6px;padding:3px 9px;cursor:pointer;font-family:Kanit,sans-serif;transition:all 0.2s;" onmouseover="this.style.background='rgba(116,192,252,0.22)'" onmouseout="this.style.background='rgba(116,192,252,0.12)'">ทั้งหมด</button>
          <button onclick="clearAllForItem(${item.id})" style="font-size:0.72rem;background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.2);color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:Kanit,sans-serif;transition:all 0.2s;" onmouseover="this.style.color='#ff6b6b'" onmouseout="this.style.color='var(--muted)'">ล้าง</button>
        </div>
      </div>
      <div class="person-checkboxes" id="menu-checks-${item.id}"></div>
      <div id="menu-warn-${item.id}" style="display:none;font-size:0.78rem;color:#ff6b6b;margin-top:6px;">⚠️ กรุณาเลือกอย่างน้อย 1 คน</div>
    `;
    list.appendChild(div);
    renderChecksFor(item);
  });
}

function renderMenuCheckboxes() {
  menuItems.forEach(item => renderChecksFor(item));
}

function renderChecksFor(item) {
  const container = document.getElementById(`menu-checks-${item.id}`);
  if (!container) return;
  container.innerHTML = '';
  if (people.length === 0) {
    container.innerHTML = '<span style="font-size:0.78rem;color:var(--muted);">เพิ่มเพื่อนก่อนนะ 👆</span>';
    return;
  }
  people.forEach(p => {
    const checked = item.people.includes(p.id);
    const span = document.createElement('span');
    span.className = 'person-check' + (checked ? ' checked' : '');
    if (checked) {
      span.style.borderColor = p.color + '99';
      span.style.background = p.color + '22';
      span.style.color = p.color;
    }
    const name = p.name || `คนที่ ${people.indexOf(p)+1}`;
    span.innerHTML = `<span class="check-dot" style="${checked?`background:${p.color}`:''}"></span>${p.emoji} ${name}`;
    span.onclick = () => togglePersonForItem(item.id, p.id);
    container.appendChild(span);
  });
  // Update counter
  const countEl = document.getElementById(`menu-count-${item.id}`);
  const warnEl = document.getElementById(`menu-warn-${item.id}`);
  if (countEl) {
    const n = item.people.length;
    countEl.textContent = n > 0 ? `(${n} คน)` : '(ยังไม่ได้เลือก)';
    countEl.style.color = n > 0 ? 'var(--accent2)' : '#ff6b6b';
  }
  if (warnEl) warnEl.style.display = 'none';
}

function selectAllForItem(menuItemId) {
  const item = menuItems.find(m => m.id === menuItemId);
  if (!item) return;
  item.people = people.map(p => p.id);
  renderChecksFor(item);
}

function clearAllForItem(menuItemId) {
  const item = menuItems.find(m => m.id === menuItemId);
  if (!item) return;
  item.people = [];
  renderChecksFor(item);
}

function togglePersonForItem(menuItemId, personId) {
  const item = menuItems.find(m => m.id === menuItemId);
  if (!item) return;
  const idx = item.people.indexOf(personId);
  if (idx === -1) item.people.push(personId);
  else item.people.splice(idx, 1);
  renderChecksFor(item);
}

function updateMenuName(id, val) {
  const item = menuItems.find(m => m.id === id);
  if (item) item.name = val;
}
function updateMenuPrice(id, val) {
  const item = menuItems.find(m => m.id === id);
  if (item) item.price = parseFloat(val) || 0;
}

function setTip(amount) {
  document.getElementById('tip-amount').value = amount || '';
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function syncTipPresets() {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

function calculate() {
  if (people.length === 0) { alert('กรุณาเพิ่มรายชื่อเพื่อนก่อนนะ 😊'); return; }
  if (menuItems.length === 0 || menuItems.every(m => m.price === 0)) {
    alert('กรุณาเพิ่มเมนูและราคาก่อนนะ 🍽️'); return;
  }
  // Warn items with price but no one selected — highlight them
  let hasUnselected = false;
  menuItems.forEach(item => {
    if (item.price > 0 && item.people.length === 0) {
      const warnEl = document.getElementById(`menu-warn-${item.id}`);
      if (warnEl) warnEl.style.display = 'block';
      hasUnselected = true;
    }
  });
  if (hasUnselected) {
    alert('⚠️ กรุณาเลือกว่าใครกินแต่ละเมนูก่อนนะ\nหรือกด "ทั้งหมด" ถ้าทุกคนกินด้วยกัน');
    return;
  }

  const useVAT = document.getElementById('vat-toggle').checked;
  const useService = document.getElementById('service-toggle').checked;
  const tip = parseFloat(document.getElementById('tip-amount').value) || 0;
  const discount = parseFloat(document.getElementById('discount-amount').value) || 0;

  // Calculate per-person share
  const personAmounts = {};
  const personItems = {};
  people.forEach(p => {
    personAmounts[p.id] = 0;
    personItems[p.id] = [];
  });

  let subtotal = 0;
  menuItems.forEach(item => {
    if (item.price <= 0) return;
    const forWho = item.people.length > 0 ? item.people : people.map(p => p.id);
    const share = item.price / forWho.length;
    forWho.forEach(pid => {
      if (personAmounts[pid] !== undefined) {
        personAmounts[pid] += share;
        personItems[pid].push({ name: item.name || 'เมนู', share });
      }
    });
    subtotal += item.price;
  });

  // Apply discount first
  const discountRatio = subtotal > 0 ? Math.max(0, Math.min(1, (subtotal - discount) / subtotal)) : 1;
  Object.keys(personAmounts).forEach(pid => {
    personAmounts[pid] *= discountRatio;
  });

  let grandSubtotal = subtotal - discount;
  let serviceAmount = 0, vatAmount = 0;

  if (useService) {
    serviceAmount = grandSubtotal * 0.10;
    const serviceRatio = grandSubtotal > 0 ? serviceAmount / grandSubtotal : 0;
    Object.keys(personAmounts).forEach(pid => {
      personAmounts[pid] += personAmounts[pid] * 0.10;
    });
    grandSubtotal += serviceAmount;
  }
  if (useVAT) {
    vatAmount = grandSubtotal * 0.07;
    const vatRatio = grandSubtotal > 0 ? vatAmount / grandSubtotal : 0;
    Object.keys(personAmounts).forEach(pid => {
      personAmounts[pid] += personAmounts[pid] * 0.07;
    });
    grandSubtotal += vatAmount;
  }

  // Tip split equally
  const tipPerPerson = people.length > 0 ? tip / people.length : 0;
  grandSubtotal += tip;
  Object.keys(personAmounts).forEach(pid => {
    personAmounts[pid] += tipPerPerson;
  });

  // Render
  const resultList = document.getElementById('result-list');
  resultList.innerHTML = '';

  people.forEach((p, i) => {
    const amount = personAmounts[p.id] || 0;
    const name = p.name || `คนที่ ${i+1}`;
    const items = personItems[p.id] || [];
    const itemText = items.map(it => `${it.name} ฿${it.share.toFixed(0)}`).join(', ');

    const div = document.createElement('div');
    div.className = 'result-item';
    div.style.animationDelay = (i * 0.06) + 's';
    const displayAmount = Number.isInteger(amount) ? amount.toFixed(0) : amount.toFixed(2).replace(/\.?0+$/, '');
    div.innerHTML = `
      <div class="result-left">
        <div class="person-avatar" style="background:${p.color}22; color:${p.color}; border:1.5px solid ${p.color}55; width:44px; height:44px; font-size:1.2rem; border-radius:50%; display:flex; align-items:center; justify-content:center;">${p.emoji}</div>
        <div>
          <div class="result-name">${name}</div>
          <div class="result-detail">${itemText || 'ไม่มีเมนู'}</div>
        </div>
      </div>
      <div class="result-amount">฿${displayAmount}<span class="unit">บาท</span></div>
    `;
    resultList.appendChild(div);
  });

  // Grand total
  const grandDisplay = Number.isInteger(grandSubtotal) ? grandSubtotal.toFixed(0) : grandSubtotal.toFixed(2).replace(/\.?0+$/, '');
  document.getElementById('grand-total').textContent = `฿${grandDisplay}`;
  let detailParts = [`ค่าอาหาร ฿${subtotal.toFixed(0)}`];
  if (discount > 0) detailParts.push(`ส่วนลด -฿${discount.toFixed(0)}`);
  if (useService) detailParts.push(`Service +฿${serviceAmount.toFixed(0)}`);
  if (useVAT) detailParts.push(`VAT +฿${vatAmount.toFixed(0)}`);
  if (tip > 0) detailParts.push(`ทิป +฿${tip.toFixed(0)}`);
  document.getElementById('total-detail').textContent = detailParts.join(' · ');

  // Show results
  const resultsDiv = document.getElementById('results');
  resultsDiv.style.display = 'block';
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Store for copy
  window._lastResult = { people, personAmounts, grandSubtotal, tipPerPerson, useVAT, useService, tip };
}

function copyResult() {
  if (!window._lastResult) return;
  const { people, personAmounts } = window._lastResult;
  let text = '🍜 สรุปค่าอาหาร\n';
  text += '─'.repeat(25) + '\n';
  people.forEach((p, i) => {
    const name = p.name || `คนที่ ${i+1}`;
    const amt = personAmounts[p.id] || 0;
    const amtDisplay = Number.isInteger(amt) ? amt.toFixed(0) : amt.toFixed(2).replace(/\.?0+$/, '');
    text += `${p.emoji} ${name}: ฿${amtDisplay} บาท\n`;
  });
  text += '─'.repeat(25) + '\n';
  const grandTotalText = document.getElementById('grand-total').textContent;
  text += `รวมทั้งหมด: ${grandTotalText} บาท`;

  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copied-msg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2500);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const msg = document.getElementById('copied-msg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2500);
  });
}

// Init with some defaults
addPerson('');
addPerson('');
addMenuItem();
</script>
